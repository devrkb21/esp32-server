services:
  # Database Service
  xiaozhi-esp32-server-db:
    image: mysql:8.0
    container_name: xiaozhi-esp32-server-db
    restart: always
    environment:
      - TZ=Asia/Dhaka
      - MYSQL_ROOT_PASSWORD=xiaozhi_internal_pass
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
      - ./main/voiceprint/init.sql:/docker-entrypoint-initdb.d/init-voiceprint.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pxiaozhi_internal_pass"]
      timeout: 20s
      interval: 10s
      retries: 10
    networks:
      - xiaozhi-net

  # Redis Cache Service
  xiaozhi-esp32-server-redis:
    image: redis:alpine
    container_name: xiaozhi-esp32-server-redis
    restart: always
    environment:
      - TZ=Asia/Dhaka
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - xiaozhi-net

  # Web Management Console & Java API (Port 8002)
  xiaozhi-esp32-server-web:
    build:
      context: .
      dockerfile: Dockerfile-web
    container_name: xiaozhi-esp32-server-web
    restart: always
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-18002}:8002"
    environment:
      - TZ=Asia/Dhaka
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Dhaka&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=xiaozhi_internal_pass
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_DOMAIN=${SERVER_DOMAIN:-esp.czbd.app}
      - MQTT_PUBLIC_IP=${MQTT_PUBLIC_IP:?Set MQTT_PUBLIC_IP in .env}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - UDP_PORT=${UDP_PORT:-8884}
      - MQTT_API_PORT=${MQTT_API_PORT:-8007}
      - MQTT_SIGNATURE_KEY=${MQTT_SIGNATURE_KEY:?Set MQTT_SIGNATURE_KEY in .env}
      - MANAGER_API_SECRET=${MANAGER_API_SECRET:?Set MANAGER_API_SECRET in .env}
      - VOICEPRINT_KEY=${VOICEPRINT_KEY:?Set VOICEPRINT_KEY in .env}
      - WS_PORT=${WS_PORT:-18000}
      - VISION_PORT=${VISION_PORT:-18003}
    volumes:
      - ./uploadfile:/uploadfile
    networks:
      - xiaozhi-net

  # Python AI WebSocket Server (Custom Port)
  xiaozhi-esp32-server:
    build:
      context: .
      dockerfile: Dockerfile-server
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-web
    # 8003: companion / vision API, robots sync with it directly. 8000: voice WebSocket, for devices
    # on the WebSocket protocol (robots on MQTT reach it through the gateway inside Docker).
    ports:
      - "${WS_PORT:-18000}:8000"
      - "${VISION_PORT:-18003}:8003"
    environment:
      - TZ=Asia/Dhaka
      - MANAGER_API_SECRET=${MANAGER_API_SECRET:?Set MANAGER_API_SECRET in .env}
      - MANAGER_API_URL=${MANAGER_API_URL:-http://xiaozhi-esp32-server-web:8002/xiaozhi}
    volumes:
      - ./main/xiaozhi-server/data:/opt/xiaozhi-esp32-server/data
      - ./main/xiaozhi-server/models:/opt/xiaozhi-esp32-server/models
    networks:
      - xiaozhi-net

  # MQTT Gateway Service (Device Tools, Auto-Reading & Online Asset Flashing)
  xiaozhi-esp32-server-mqtt:
    build:
      context: .
      dockerfile: Dockerfile-mqtt
    container_name: xiaozhi-esp32-server-mqtt
    restart: always
    command: ["node", "app.js"]
    depends_on:
      - xiaozhi-esp32-server
      - xiaozhi-esp32-server-web
    # The management API (8007) is only used inside the Docker network, so it is not published.
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${UDP_PORT:-8884}:8884/udp"
    environment:
      - TZ=Asia/Dhaka
      - PUBLIC_IP=${MQTT_PUBLIC_IP:?Set MQTT_PUBLIC_IP in .env (devices receive it as the UDP audio address)}
      - MQTT_PORT=1883
      - UDP_PORT=8884
      - API_PORT=8007
      - MQTT_SIGNATURE_KEY=${MQTT_SIGNATURE_KEY:?Set MQTT_SIGNATURE_KEY in .env}
      - SERVER_SECRET=${MANAGER_API_SECRET:?Set MANAGER_API_SECRET in .env}
    volumes:
      - ./main/mqtt-gateway/config:/app/config
    networks:
      - xiaozhi-net

  # Voiceprint Database Auto-Initializer
  xiaozhi-esp32-server-voiceprint-init:
    image: mysql:8.0
    container_name: xiaozhi-esp32-server-voiceprint-init
    restart: "no"
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
    environment:
      - VOICEPRINT_KEY=${VOICEPRINT_KEY:?Set VOICEPRINT_KEY in .env}
    volumes:
      - ./main/voiceprint/init.sql:/init.sql:ro
      - ./main/voiceprint/data:/voiceprint-data
    # Creates the voiceprint DB and writes the service config with the API key from .env
    # (the key is never committed).
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mysql -h xiaozhi-esp32-server-db -u root -pxiaozhi_internal_pass < /init.sql
        cat > /voiceprint-data/.voiceprint.yaml <<EOF
        server:
          host: 0.0.0.0
          port: 8005
          authorization: "$${VOICEPRINT_KEY}"

        mysql:
          host: "xiaozhi-esp32-server-db"
          port: 3306
          user: "root"
          password: "xiaozhi_internal_pass"
          database: "voiceprint_db"

        voiceprint:
          similarity_threshold: 0.4
          target_sample_rate: 16000
          tmp_dir: "tmp"

        logging:
          level: "INFO"
        EOF
    networks:
      - xiaozhi-net

  # Voiceprint Recognition Service (3D-Speaker API)
  xiaozhi-esp32-server-voiceprint:
    image: ${VOICEPRINT_IMAGE:-ghcr.io/xinnan-tech/voiceprint-api:latest}
    container_name: xiaozhi-esp32-server-voiceprint
    restart: always
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-voiceprint-init:
        condition: service_completed_successfully
    # No host port: only manager-api and xiaozhi-server (same Docker network) call this API.
    volumes:
      - ./main/voiceprint/data:/app/data
    security_opt:
      - seccomp:unconfined
    networks:
      - xiaozhi-net

networks:
  xiaozhi-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
