# In development, please create a data directory in the project root, then create an empty file named [.config.yaml] in data/
# To override any configuration, modify the [.config.yaml] file rather than modifying [config.yaml]
# The system will prioritize reading [data/.config.yaml]. If a config key does not exist there, it falls back to [config.yaml].
# This simplifies configuration and protects your secret keys.
# If you use the management console, the configs below will not take effect; please configure in the console instead.

# #####################################################################################
# ############################# Basic Server Configuration #############################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interface (single server deployment) and vision analysis interface
  http_port: 8003
  # WebSocket address sent to devices by OTA interface
  # By default, OTA automatically generates WebSocket address in startup logs; verify via browser
  # When using Docker or public network deployment (SSL, domain), this may not be accurate
  # For Docker deployment, set websocket to local network address
  # For public deployment, set websocket to public domain/IP address
  websocket: ws://YOUR_IP_OR_DOMAIN:PORT/xiaozhi/v1/
  # Vision analysis interface address sent to devices
  # System automatically generates address in startup log by default; verify via browser
  # For Docker deployment, set vision_explain to local network address
  # For public deployment, set vision_explain to public domain/IP address
  vision_explain: http://YOUR_IP_OR_DOMAIN:PORT/mcp/vision/explain
  # OTA response timezone offset
  timezone_offset: +6
  # Authentication configuration
  auth:
    # Whether authentication is enabled
    enabled: false
    # Whitelisted device ID list (devices in whitelist bypass token validation)
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway configuration, delivered to devices via OTA (format host:port)
  mqtt_gateway: null
  # MQTT signature key, used to generate MQTT connection password
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Console log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log file output format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory path
  log_dir: tmp
  # Log filename
  log_file: "server.log"
  # Data directory path
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# Disconnect connection after no voice input for seconds (default 2 minutes = 120 seconds)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wakeup word response cache acceleration
enable_wakeup_words_response_cache: true
# Whether to respond with greeting on wakeup
enable_greeting: true
# Whether to play notification sound after finishing speaking
enable_stop_tts_notify: false
# Sound file path for finish speaking notification
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat ping mechanism
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls interval between sending audio packets
#   0: Use precise time control matching audio frame rate (default)
#   > 0: Use fixed delay (ms) for sending, e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself"
    - "What's the weather like today?"
    - "Please summarize the basic principles and future applications of quantum computing in 100 words"

# Wakeup words, used to distinguish wakeup word from speech content
wakeup_words:
  - "Hello Xiaozhi"
  - "Hey hello"
  - "Hi Xiaozhi"
  - "Xiaoai"
  - "Hello Xiaoxin"
  - "Xiaomei"
  - "Xiaolong"
  - "Miaomiao"
  - "Xiaobin"
  - "Xiaobing"
# MCP endpoint address format: ws://YOUR_MCP_ENDPOINT_IP_OR_DOMAIN:PORT/mcp/?token=YOUR_TOKEN
# Detailed guide: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your_mcp_endpoint_websocket_address

# Context providers configuration
# Used to inject dynamic data into system prompt, such as health data, stock info, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Plugin base configuration
plugins:
  # Weather plugin configuration, enter your api_key here
  # Shared project key, apply for a dedicated key for stability (1000 free calls/day)
  # Application URL: https://console.qweather.com/#/apps/create-key/over
  # Api host settings: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "Guangzhou"
  # News plugin configuration: enter corresponding URL for desired news types (society, tech, finance)
  # More news categories at https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "ThePaper;Baidu;CLS"
  home_assistant:
    devices:
      - Living Room,Toy Light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk Lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your_home_assistant_api_token
  play_music:
    music_dir: "./music"  # Music file path, searched recursively
    music_ext: # Music file extension (p3 format is most efficient)
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval to refresh music list in seconds
  search_from_ragflow:
    # Knowledge base description to guide LLM when to invoke
    description: "Call this tool when user asks about relevant topics to retrieve knowledge base information"
    # ragflow interface configuration
    base_url: "http://192.168.0.8"
    # ragflow API access token
    api_key: "ragflow-xxx"
    # ragflow dataset IDs
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Supports metaso and tavily
  # Metaso API Key: https://metaso.cn/search-api/api-keys
  # Tavily API Key: https://app.tavily.com/home
  web_search:
    # Search provider: metaso / tavily
    provider: "metaso"
    # Tool description
    description: "Web search tool. Used when the user explicitly requests web searching for information."
    # Result count (default 5)
    max_results: 5
    # API Key (mk- prefix for metaso / tvly- prefix for tavily)
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint endpoint URL
  url: 
  # Speaker configuration: speaker_id,name,description
  speakers:
    - "test1,Zhang San,Zhang San is a programmer"
    - "test2,Li Si,Li Si is a product manager"
    - "test3,Wang Wu,Wang Wu is a designer"
  # Voiceprint recognition similarity threshold (0.0-1.0, default 0.4)
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Character & Model Config ############################

prompt: |
  You are Xiaozhi, a witty, lively, and intelligent AI companion. You speak in an engaging and humorous way, knowledgeable in coding and modern tech.
  [Core Characteristics]
  - Energetic and friendly, blending humor with sharp intellect
  - Excellent conversational flow and playful banter
  - Strong tech affinity: understands complex programming concepts but explains them simply
  [Interaction Guidelines]
  When the user:
  - Tells a joke -> Respond with laughter and witty commentary
  - Discusses daily life -> Share relatable, cheerful perspectives
  - Asks technical questions -> Provide insightful, crisp explanations
  Never:
  - Produce long, tedious monologues
  - Maintain overly formal or robotic tone

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Response on system error
system_error_response: "Master, Xiaozhi is a bit busy right now. Let's try again later."

# Farewell prompt configuration
end_prompt:
  enable: true # Whether to enable farewell prompt
  # Farewell prompt
  prompt: |
    Please end this conversation warmly and affectionately, beginning with "Time really flies"!

# The module selected for specific processing
selected_module:
  # Voice Activity Detection module, default SileroVAD
  VAD: SileroVAD
  # Speech Recognition module, default FunASR
  ASR: FunASR
  # Calls actual LLM adapter by configured type
  LLM: ChatGLMLLM
  # Vision Language Model
  VLLM: ChatGLMVLLM
  # Calls actual TTS adapter by configured type
  TTS: EdgeTTS
  # Memory module (nomem, mem0ai, mem_local_short)
  Memory: nomem
  # Intent recognition module: nointent, intent_llm, or function_call
  Intent: function_call

# Intent recognition configuration
Intent:
  # No intent recognition
  nointent:
    type: nointent
  intent_llm:
    type: intent_llm
    # Dedicated thinking model for intent recognition
    # Defaults to selected_module.LLM if unspecified
    llm: ChatGLMLLM
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    type: function_call
    functions:
      - change_role
      - web_search                  # Web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is server built-in player; hass_play_music is via Home Assistant
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: your_mem0ai_api_key
  powermem:
    # PowerMem is an open-source agent memory component from OceanBase
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    type: powermem
    # Whether to enable user profiling (UserMemory)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    llm:
      provider: openai  # Optional: qwen, openai, zhipu, etc.
      config:
        api_key: your_llm_api_key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai  # Optional: qwen, openai, etc.
      config:
        api_key: your_embedding_api_key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024

    # ========== Database Configuration ==========
    vector_store:
      provider: sqlite
      config: {}  # SQLite requires no additional config
  nomem:
    type: nomem
  mem_local_short:
    # Local short-term memory, saved locally on server
    type: mem_local_short
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Recognition language: auto for automatic detection; set to zh, en, ja, ko, yue, etc.
    language: auto
  FunASRServer:
    # Independently deploy FunASR using FunASR API service
    # Step 1: mkdir -p ./funasr-runtime-resources/models
    # Step 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After executing above command, enter container and continue step 3: cd FunASR/runtime
    # Stay in container and execute step 4: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # Continue step 5: tail -f log.txt
    # After step 5 completes, observe model download logs; once downloaded, it is ready to use
    # Above is CPU inference; for GPU reference: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (manual model download required)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer
    model_type: sense_voice
  SherpaParaformerASR:
    # Speech recognition model for low-performance devices (e.g. RK3566-2g)
    # See docs/sherpa-paraformer-guide.md for detailed instructions
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for keys at: https://console.volcengine.com/speech/app
    # DoubaoStreamASR uses LLM technology for higher accuracy
    type: doubao
    appid: your_volcengine_appid
    access_token: your_volcengine_access_token
    cluster: volcengine_input_common
    # Hotword and replacement word guide: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_hotword_table_name_optional
    correct_table_name: your_replacement_table_name_optional
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for keys at: https://console.volcengine.com/speech/app
    # Enable at: https://console.volcengine.com/speech/service/10011
    type: doubao_stream
    appid: your_volcengine_appid
    access_token: your_volcengine_access_token
    # Resource ID: hourly volc.bigasr.sauc.duration, concurrency volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hotword and replacement word guide: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_hotword_table_name_optional
    correct_table_name: your_replacement_table_name_optional
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # Multilingual recognition: see https://www.volcengine.com/docs/6561/1354869
    # language: en-us
    # Silence decision duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition model 2.0 (based on Volcengine seed-asr)
    # Enable at: https://console.volcengine.com/speech/service/10038
    type: doubao_stream
    appid: your_volcengine_appid
    access_token: your_volcengine_access_token
    # Resource ID: hourly volc.seedasr.sauc.duration, concurrency volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hotword and replacement word guide: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_hotword_table_name_optional
    correct_table_name: your_replacement_table_name_optional
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # Multilingual recognition: see https://www.volcengine.com/docs/6561/1354869
    # language: en-us
    # Silence decision duration (ms), default 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application: https://console.cloud.tencent.com/cam/capi
    # Resource bundle: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: your_tencent_appid
    secret_id: your_tencent_secret_id
    secret_key: your_tencent_secret_key
    output_dir: tmp/
  AliyunASR:
    # Aliyun Intelligent Speech Interaction service
    # HTTP POST request processing audio in batch
    # Platform: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    # Define ASR API type
    type: aliyun
    appkey: your_aliyun_appkey
    token: your_aliyun_token
    access_key_id: your_aliyun_access_key_id
    access_key_secret: your_aliyun_access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Aliyun Intelligent Speech Interaction service - Realtime Streaming ASR
    # WebSocket connection for streaming audio
    # Platform: https://nls-portal.console.aliyun.com/
    # Appkey: https://nls-portal.console.aliyun.com/applist
    # Token: https://nls-portal.console.aliyun.com/overview
    # Define ASR API type
    type: aliyun_stream
    appkey: your_aliyun_appkey
    token: your_aliyun_token
    access_key_id: your_aliyun_access_key_id
    access_key_secret: your_aliyun_access_key_secret
    # Server region selection, choose closer region to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence segmentation detection time (ms), controls silence duration before splitting, default 800ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # View resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: your_baidu_appid
    api_key: your_baidu_apikey
    secret_key: your_baidu_secretkey
    # Language parameter (1537 for Mandarin), see: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service
    # Multilingual support, see https://platform.openai.com/docs/guides/speech-to-text
    # 1. Log in to OpenAI Platform: https://auth.openai.com/log-in
    # 2. Create api-key: https://platform.openai.com/settings/organization/api-keys
    # 3. Model choice: gpt-4o-transcribe or gpt-4o-mini-transcribe
    type: openai
    api_key: your_openai_api_key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service
    # 1. Log in to Groq Console: https://console.groq.com/home
    # 2. Create api-key: https://console.groq.com/keys
    # 3. Models: whisper-large-v3-turbo or whisper-large-v3
    type: openai
    api_key: your_groq_api_key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website: https://alphacephei.com/vosk/
    # 1. VOSK is an offline multilingual speech recognition library
    # 2. Download model files from https://alphacephei.com/vosk/models
    # 3. Extract model to models/vosk/ folder in project directory
    # 4. Specify the correct model path below
    type: vosk
    model_path: your_model_path_such_as_models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition service
    # 1. Log in to DashScope: https://bailian.console.aliyun.com/
    # 2. Create API-KEY: https://bailian.console.aliyun.com/#/api-key
    # 3. Supports multilingual recognition, singing recognition, noise rejection
    type: qwen3_asr_flash
    api_key: your_dashscope_api_key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options configuration
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "en"  # Language: zh, en, ja, ko, etc.
    context: ""  # Context information to improve accuracy (up to 10000 tokens)
  XunfeiStreamASR:
    # Xunfei Streaming Speech Recognition service
    # Platform: https://www.xfyun.cn/
    # Obtain credentials from My Applications:
    # - APPID, APISecret, APIKey
    type: xunfei_stream
    # Required parameters - Xunfei application credentials
    app_id: your_app_id
    api_key: your_api_key
    api_secret: your_api_secret
    # Recognition parameters
    domain: slm # Domain: iat (daily), medical, finance, etc.
    language: zh_cn # Language: zh_cn, en_us
    accent: mandarin # Accent: mandarin
    # Adjust audio processing parameters for long speech quality
    output_dir: tmp/
  AliyunBLStreamASR:
    # DashScope Paraformer Real-time Speech Recognition service
    # Real-time WebSocket streaming ASR with multilingual, hotword customization, semantic punctuation
    # Platform: https://bailian.console.aliyun.com/
    # API Key: https://bailian.console.aliyun.com/#/api-key
    # Documentation: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: your_dashscope_api_key
    # Model selection (v2 recommended)
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate, v1 supports 16000, 8k version supports 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Filter filler words
    semantic_punctuation_enabled: false  # Semantic punctuation (true: conference; false: VAD low latency)
    max_sentence_silence: 200  # VAD silence threshold (ms), range 200-6000
    multi_threshold_mode_enabled: false  # Prevent overly long cuts
    punctuation_prediction_enabled: true  # Auto punctuation
    inverse_text_normalization_enabled: true  # ITN normalization
    # Hotword customization doc: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx  # Hotword ID (optional)
    # language_hints: ["en", "zh"]  # Specified languages (optional): en, zh, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # Increase this value if speech pauses are longer

LLM:
  # All openai types can modify hyperparameters; AliLLM is an example
  # Supported types: openai, dify, ollama, custom adapters
  AliLLM:
    # Define LLM API type
    type: openai
    # Find your api_key at https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: your_deepseek_api_key
    temperature: 0.7  # Temperature
    max_tokens: 500   # Max generation tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  AliAppLLM:
    # Define LLM API type
    type: AliBL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    app_id: your_app_id
    # Find your api_key at https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: your_api_key
    # Whether to bypass local prompt: true|false (set prompt in DashScope app)
    is_no_prompt: true
    # Ali_memory_id: false (unused) | your_memory_id (from DashScope app settings)
    # Tips: Ali_memory does not support multi-user partition
    ali_memory_id: false
  DoubaoLLM:
    # Define LLM API type
    type: openai
    # Open Volcengine console and enable Doubao-Seed-2.0-Lite
