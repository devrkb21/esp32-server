# If you only want a lightweight installation of xiaozhi-server using local configuration files, you do not need this file.
# If you want to fetch configuration from manager-api, please see below:
# Copy this file to xiaozhi-server/data directory (create data directory if it does not exist) and name it .config.yaml
# Note: If .config.yaml already exists in data directory, delete it first
# Start manager-api and manager-web first, register an account (the first registered account is admin)
# Log in as admin, go to [Parameter Management] page, find [server.secret], copy its value. Note: server.secret changes on every fresh deployment
# Open .config.yaml in data directory, set manager-api.secret to the copied server.secret
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for vision analysis interface
  http_port: 8003
  # Vision analysis interface address
  # Interface address for vision analysis sent to devices
  # If using the default below, the system automatically generates the vision recognition address in the startup log. You can verify it in browser
  # When using Docker or public network deployment (with SSL/domain), this may not be accurate
  # If deploying with Docker, set vision_explain to local network IP
  # If deploying publicly, set vision_explain to public domain/IP
  vision_explain: http://YOUR_IP_OR_DOMAIN:PORT/mcp/vision/explain
manager-api:
  # manager-api address, preferably local network IP
  # If deploying with Docker, use http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # manager-api token, which is the server.secret copied earlier
  secret: your_server_secret_value
# Default system prompt template file
prompt_template: agent-base-prompt.txt