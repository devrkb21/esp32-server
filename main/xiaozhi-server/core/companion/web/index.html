<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d8a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1b1e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TinyBot">
  <meta name="description" content="TinyBot companion: alarms, reminders, prayer times and messages for your robot">
  <title>TinyBot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="ফিরে যাও" hidden>&#8592;</button>
    <h1 id="title">TinyBot</h1>
    <span id="status-dot" class="dot" title="offline"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <noscript>এই অ্যাপ চালাতে JavaScript লাগবে।</noscript>
  <script src="app.js"></script>
</body>
</html>
